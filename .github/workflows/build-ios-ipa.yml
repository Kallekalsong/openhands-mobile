name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ ios-ipa-build ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install --non-interactive

      - name: Build iOS IPA (development, EAS cloud)
        id: build
        run: |
          eas build --platform ios --profile development --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Display EAS build info
        run: |
          echo "============================================"
          echo "iOS build completed on EAS cloud servers."
          echo "============================================"
          echo ""
          echo "Download the signed IPA from the EAS dashboard:"
          echo "  https://expo.dev/accounts/${{ secrets.EXPO_USERNAME }}/projects/openhands-mobile/builds"
          echo ""
          echo "Recent builds:"
          eas build:list --platform ios --limit 5 2>&1 || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
