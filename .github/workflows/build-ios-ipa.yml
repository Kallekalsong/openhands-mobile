name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ ios-build ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install --non-interactive

      - name: Build iOS IPA (development, local)
        run: eas build --platform ios --profile development --non-interactive --local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Locate IPA
        run: find ios/build -name "*.ipa" -type f 2>/dev/null || echo "No IPA found in ios/build"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhands-ios-ipa
          path: |
            ios/build/*.ipa
          retention-days: 30
        if: always()
